# simd_alu pin order — 8-lane FP32 256b vectors + op 2 + valid, clock, rst
# Keep TT perimeter compatible but use separate macro hardening
# Inputs left, outputs right
# pin_order.cfg: pin name, orientation
# left
pin clk
pin rst_n
pin in_valid
pin op[0]
pin op[1]
# vector a 256b — split across north/south for routing
pin a[0]
pin a[32]
pin a[64]
pin a[96]
pin a[128]
pin a[160]
pin a[192]
pin a[224]
# vector b
pin b[0]
pin b[32]
pin b[64]
pin b[96]
# right
pin out_valid
pin result[0]
pin result[32]
pin result[64]
pin result[96]
pin result[128]
pin result[160]
pin result[192]
pin result[224]
