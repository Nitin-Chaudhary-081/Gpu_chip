      data:
        id: ADR-002
        title: 'Tapeout Priority: tt_um_4d_cache CMOS first, CNFET SPICE parallel'
        reason: >-
          Per approve 2026-09-01: standard CMOS silicon via TinyTapeout builds immediate momentum;
          CNFET/MEEP/OpenFOAM remain parallel research track. gpu_A.md:19-23 + gpu_A.md:59-69
          long-term. Keeps standard flow (Yosys/OpenLane sky130A) moving.
        alternatives:
          - Delay tapeout until CNFET SPICE ready (PhD-scale, 12-18mo slip)
          - Tapeout CNFET directly (no PDK exists — sky130 is Si-proxy, drc_lvs/waivers.md:1)
        tradeoffs: >-
          Ships real Si now (Si-proxy) vs waits for exotic materials; validates 4D cache logic on
