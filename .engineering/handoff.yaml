importantDecisions:
  - id: ADR-002
    title: 'Tapeout Priority: tt_um_4d_cache CMOS first, CNFET SPICE parallel'
    reason: >-
      Per approve 2026-09-01: standard CMOS silicon via TinyTapeout builds immediate momentum;
      CNFET/MEEP/OpenFOAM remain parallel research track. gpu_A.md:19-23 + gpu_A.md:59-69 long-term.
      Keeps standard flow (Yosys/OpenLane sky130A) moving.
    alternatives:
      - Delay tapeout until CNFET SPICE ready (PhD-scale, 12-18mo slip)
      - Tapeout CNFET directly (no PDK exists — sky130 is Si-proxy, drc_lvs/waivers.md:1)
    tradeoffs: >-
      Ships real Si now (Si-proxy) vs waits for exotic materials; validates 4D cache logic on
      fabricatable path while SPICE research matures
    research: gpu_A.md:163-172 path forward; Stanford VS-CNT model vs Python cnfet_model.py:13
    evidence:
      - type: CODE
        source: sim/cache4d/rtl/gpu_top.v:1
        kind: FACT
      - type: DOCUMENTATION
        source: gpu_A.md:19
        kind: FACT
      - type: CODE
        source: .github/workflows/gds.yaml:69
        kind: FACT
    confidence: high
    date: '2026-09-01'
    status: APPROVED
    decidedBy: user approve tapeout priority
    links:
      - gpu_A.md:37-57
      - gpu.md:5-7
  - id: ADR-003
    title: Die Footprint 160×100 TT standard, defer 1mm 4-CU branch
    reason: >-
      Stick to TinyTapeout standard die 0 0 160 100 (openlane/gpu_top/config.json:16) for low-risk
      submission; defer 1mm floorplan branch (gpu_A.md:53 + gpu_A.md:151 400×400 4CU) to subsequent
      scaling phase. UTIL45 PL_DENSITY0.55 with PDN 15.2/1.6 ensures closure.
    alternatives:
      - 1mm ×1mm 4-CU immediately (higher congestion, timing risk, needs Codespaces)
      - 200×200 single block (cache4d size) — not TT-compliant
    tradeoffs: Guaranteed DRC/LVS now vs larger multi-core later; FP_PDN grid tuned for 160×100
    research: gpu_A.md:53 floorplan, gpu_A.md:146 CU spec 16×FP32; verified gls at 10ns tb_cache_4d_top.v:73
    evidence:
      - type: CODE
        source: openlane/gpu_top/config.json:16
        kind: FACT
      - type: CODE
        source: openlane/gpu_top/pin_order.cfg:1
        kind: FACT
    confidence: high
    date: '2026-09-01'
    status: APPROVED
    decidedBy: user approve
    links:
      - openlane/gpu_top/config.json:16
      - gpu_A.md:53
  - id: ADR-004
    title: FP32 strict for initial tapeout, keep TDM4/WDM8 baseline
    reason: >-
      Avoid FP16/BF16 mux control + routing congestion prematurely; baseline lambda=t[2:0]%8
      slot=(z[1:0]+t[1:0])%4 cycles4+slot*2 gpu_A.md:16 keeps timing closure inside 160×100. 16×FP32
      CU deferred to 1mm branch gpu_A.md:146.
    alternatives:
      - FP16/BF16 multiplex (saves power but adds control logic, verification x3)
      - TDM8/WDM16 scale now (more bandwidth but slot*2 latency variance larger)
    tradeoffs: Single-precision determinism now vs mixed-precision later; proven gls 16/16 PASS at TDM4/WDM8
    research: >-
      sim/cache4d/rtl/cache_4d_controller.sv:42-44 + sim/photonics/interconnect.py:11 30fJ vs Cu
      200fJ
    evidence:
      - type: CODE
        source: sim/cache4d/rtl/cache_4d_controller.sv:42
        kind: FACT
      - type: CODE
        source: sim/cache4d/rtl/gpu_top.v:58
        kind: FACT
      - type: TEST
        source: tests/test_cache4d.py
        kind: FACT
    confidence: high
    date: '2026-09-01'
    status: APPROVED
    decidedBy: user approve arithmetic precision
    links:
      - gpu_A.md:5-7
      - docs/arch.md:4
  - id: ADR-005
    title: 'Simulation env: GH Codespaces/Colab Pro for heavy FDTD/CFD'
    reason: >-
      1.9GB local VM OOM on MEEP FDTD meshing + OpenFOAM CFD microfluidics (gpu_A.md:71-79); GH
      Actions ubuntu-latest already handles OpenLane GDS; approve cloud for phase F/G
