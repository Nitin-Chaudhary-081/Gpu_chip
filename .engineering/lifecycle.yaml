keyDecisions:
  - id: ADR-001
    title: Use .engineering directory with YAML
    rationale: Git-friendly, human-readable, machine-consumable. Portable with repo.
    evidence:
      - type: CODE
        source: .engineering/manifest.yaml
        kind: FACT
    date: '2026-09-01'
  - id: ADR-002
    title: 'Tapeout Priority: tt_um_4d_cache CMOS first, CNFET SPICE parallel'
    rationale: >-
      Per approve 2026-09-01: standard CMOS silicon builds immediate momentum; CNFET/MEEP parallel
      research track. gpu_A.md:59-69 + gpu_A.md:129-143
    evidence:
      - type: DOCUMENTATION
        source: gpu_A.md:19-23
        kind: FACT
      - type: CODE
        source: sim/cache4d/rtl/gpu_top.v:1
        kind: FACT
    date: '2026-09-01'
  - id: ADR-003
    title: Die Footprint 160x100 TT standard, defer 1mm 4-CU branch
    rationale: >-
      Guarantee low-risk TT submission; 1mm CU tiling (gpu_A.md:53 400x400 4CU) for next scaling
      phase. Users approved 0.55 density single-block.
    evidence:
      - type: CODE
        source: openlane/gpu_top/config.json:16
        kind: FACT
    date: '2026-09-01'
  - id: ADR-004
    title: FP32 strict, keep TDM4/WDM8 baseline
    rationale: >-
      Avoid premature FP16/BF16 control + routing congestion; TDM4/WDM8 ensures timing closure at
      10ns inside 160x100. Defer 16xFP32 scale to 1mm branch gpu_A.md:146.
    evidence:
      - type: CODE
        source: sim/cache4d/rtl/cache_4d_controller.sv:42-44
        kind: FACT
    date: '2026-09-01'
  - id: ADR-005
    title: Simulation env GH Codespaces/Colab Pro for heavy FDTD/CFD
    rationale: >-
      1.9GB VM OOM on MEEP/OpenFOAM meshing; approved cloud for phase F/G. GH Action gds already
      runs on ubuntu-latest.
    evidence:
      - type: CODE
        source: .github/workflows/gds.yaml:24
        kind: FACT
    date: '2026-09-01'
  - id: ADR-006
    title: Commit real verified GDS, keep placeholder lean backup
    rationale: >-
      Real GDS (cache_4d_controller.gds etc) already compiled via OpenLane; commit for TT
      viewers/MPW, keep tapeout/generate_placeholder_gds.py:1 464B fallback for lean CI.
    evidence:
      - type: CODE
        source: tapeout/generate_placeholder_gds.py:1
        kind: FACT
      - type: CODE
        source: .gitignore:20
        kind: FACT
    date: '2026-09-01'
