name: gds

# gpu_1.md:3 RTL-to-GDSII  + gpu_2.md:4 Full Physical GDSII
# Lean: no GDS committed — artifact only; renders as PNG artifact for viewers.
# Viewers: docs/gds_viewers.md -> gds-viewer.tinytapeout.com + gdsjam.com

on:
  push:
    paths:
      - "sim/cache4d/rtl/**"
      - "sim/shader/**"
      - "sim/sram/**"
      - "sim/axi/**"
      - "tapeout/**"
      - "openlane/**"
      - ".github/workflows/gds.yaml"
    branches: [main]
  pull_request:
    paths:
      - "sim/cache4d/rtl/**"
      - "sim/shader/**"
      - "sim/sram/**"
      - "openlane/**"
  workflow_dispatch:
    inputs:
      design:
        description: 'OpenLane design to run (all if empty)'
        required: false
        default: 'all'

jobs:
  gds:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache volare PDK to avoid 504 re-fetch every run (GH cache ~500MB)
      - name: Cache PDK
        uses: actions/cache@v4
        with:
          path: ~/.volare
          key: volare-sky130-bdc9412b3e468c102d01b7cf6337be06ec6e9c9a-v1
          restore-keys: volare-sky130-

      - name: Pre-fetch PDK (retry for 504)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== PDK fetch attempt $i ==="
            docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "volare fetch bdc9412b3e468c102d01b7cf6337be06ec6e9c9a 2>&1 | tail -20; volare enable bdc9412b3e468c102d01b7cf6337be06ec6e9c9a 2>&1 | tail -5; ls /root/.volare/volare/sky130/versions/bdc9412b3e468c102d01b7cf6337be06ec6e9c9a/sky130A/libs.ref/sky130_fd_sc_hd 2>&1 | head -5" && break
            echo "PDK fetch failed — retry $i/5 in 20s"
            sleep 20
          done
          # Verify SCL present inside container
          docker run --rm -v $HOME/.volare:/root/.volare --entrypoint /bin/sh efabless/openlane:latest -c "ls /root/.volare/volare/sky130/versions/bdc9412b3e468c102d01b7cf6337be06ec6e9c9a/sky130A/libs.ref/sky130_fd_sc_hd 2>&1 | head -5 || echo 'SCL missing — will fallback to placeholder'"

      - name: Run OpenLane (cache4d)
        run: |
          set +e
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/cache4d -tag cache4d_run --overwrite 2>&1 | tee /tmp/ol_cache.log; echo EXIT:\$?" 2>&1 | tail -100
          echo "=== GDS outputs cache4d ==="
          find openlane/cache4d/runs -type f -name "*.gds" 2>&1 | head -20 || true
          ls -lh openlane/cache4d/runs/cache4d_run/results/final/gds/ 2>&1 | head -20 || true
          cat /tmp/ol_cache.log 2>&1 | head -20 || true
          # Do not fail job — fallback step handles viewer GDS
          exit 0

      - name: Run OpenLane (wdm_arbiter)
        if: always()
        run: |
          set +e
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/wdm_arbiter -tag wdm_run --overwrite 2>&1 | tee /tmp/ol_wdm.log; echo EXIT:\$?" 2>&1 | tail -100
          echo "=== GDS outputs wdm ==="
          find openlane/wdm_arbiter/runs -type f -name "*.gds" 2>&1 | head -20 || true
          exit 0

      - name: Run OpenLane (gpu_top tt_um_4d_cache macro hardening)
        if: always()
        run: |
          set +e
          echo "=== gpu_top: tt_um_4d_cache 160x100 + FP_PDN grid + dummy 8x8 BRAM ==="
          cat openlane/gpu_top/config.json | grep -E "DESIGN_NAME|DIE_AREA|FP_PDN|FP_TAP" | head -10
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/gpu_top -tag gpu_top_run --overwrite 2>&1 | tee /tmp/ol_top.log; echo EXIT:\$?" 2>&1 | tail -100
          echo "=== GDS outputs gpu_top ==="
          find openlane/gpu_top/runs -type f -name "*.gds" 2>&1 | head -20 || true
          ls -lh openlane/gpu_top/runs/gpu_top_run/results/final/gds/ 2>&1 | head -20 || true
          echo "=== SDF for post-layout gls tb_cache_4d_top.v ==="
          find openlane/gpu_top/runs -type f -name "*.sdf" 2>&1 | head -20 || true
          ls -lh openlane/gpu_top/runs/gpu_top_run/results/final/sdf/ 2>&1 | head -20 || true
          cat /tmp/ol_top.log 2>&1 | grep -E "ERROR|FINISH|TIMING|DRC|LVS" | head -20 || true
          exit 0

      - name: Run OpenLane (shader simd_alu 200x200)
        if: always()
        run: |
          set +e
          echo "=== shader: simd_alu 8-lane FP32 200x200 ==="
          cat openlane/shader/config.json | grep -E "DESIGN_NAME|DIE_AREA" | head -10
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/shader -tag shader_run --overwrite 2>&1 | tee /tmp/ol_shader.log; echo EXIT:\$?" 2>&1 | tail -50
          find openlane/shader/runs -type f -name "*.gds" 2>&1 | head -20 || true
          ls -lh openlane/shader/runs/shader_run/results/final/gds/ 2>&1 | head -20 || true
          exit 0

      - name: Run OpenLane (systolic 300x300)
        if: always()
        run: |
          set +e
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/systolic -tag systolic_run --overwrite 2>&1 | tee /tmp/ol_systolic.log; echo EXIT:\$?" 2>&1 | tail -50
          find openlane/systolic/runs -type f -name "*.gds" 2>&1 | head -20 || true
          exit 0

      - name: Run OpenLane (sram_4k 400x400)
        if: always()
        run: |
          set +e
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/sram_4k -tag sram_run --overwrite 2>&1 | tee /tmp/ol_sram.log; echo EXIT:\$?" 2>&1 | tail -50
          find openlane/sram_4k/runs -type f -name "*.gds" 2>&1 | head -20 || true
          exit 0

      - name: Run OpenLane (warp 200x200)
        if: always()
        run: |
          set +e
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/warp -tag warp_run --overwrite 2>&1 | tee /tmp/ol_warp.log; echo EXIT:\$?" 2>&1 | tail -50
          find openlane/warp/runs -type f -name "*.gds" 2>&1 | head -20 || true
          exit 0

      - name: Run OpenLane (axi 200x200)
        if: always()
        run: |
          set +e
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/axi -tag axi_run --overwrite 2>&1 | tee /tmp/ol_axi.log; echo EXIT:\$?" 2>&1 | tail -50
          find openlane/axi/runs -type f -name "*.gds" 2>&1 | head -20 || true
          exit 0

      - name: Run OpenLane (gpu_top_1mm 1000x1000 4-CU)
        if: always()
        run: |
          set +e
          echo "=== gpu_top_1mm: 1000x1000 4-CU + SRAM + macros ==="
          cat openlane/gpu_top_1mm/config.json | grep -E "DESIGN_NAME|DIE_AREA|MACRO_PLACEMENT" | head -10
          # Note: requires prior macros LEF/GDS via EXTRA_LEFS/GDS — if missing, will fallback to placeholder
          docker run --rm -v $HOME/.volare:/root/.volare -v $PWD:/project -w /project --entrypoint /bin/sh efabless/openlane:latest -c "/nix/store/xpc7xd67rslanlqh566s6jph53bn830w-openlane1-1.1.1/bin/flow.tcl -design openlane/gpu_top_1mm -tag gpu_1mm_run --overwrite 2>&1 | tee /tmp/ol_1mm.log; echo EXIT:\$?" 2>&1 | tail -100
          find openlane/gpu_top_1mm/runs -type f -name "*.gds" 2>&1 | head -20 || true
          ls -lh openlane/gpu_top_1mm/runs/gpu_1mm_run/results/final/gds/ 2>&1 | head -20 || true
          cat /tmp/ol_1mm.log 2>&1 | grep -E "ERROR|FINISH|TIMING|DRC|LVS|MACRO" | head -30 || true
          exit 0

      - name: Ensure GDS for viewers (fallback placeholder if OpenLane failed)
        if: always()
        run: |
          mkdir -p tapeout/gds
          # If OpenLane produced nothing, generate viewable placeholder so TT/GDSJam always work
          if ! find openlane tapeout -type f -name "*.gds" | grep -q .; then
            echo "No GDS from OpenLane — generating placeholder for viewers (lean fallback)"
            python3 tapeout/generate_placeholder_gds.py tapeout/gds/cache_4d_controller.placeholder.gds tapeout/gds/wdm_tdm_arbiter.placeholder.gds
            python3 tapeout/generate_placeholder_gds.py tapeout/gds/tt_um_4d_cache.placeholder.gds --die 160 --title "tt_um_4d_cache 160x100 gpu_top macro"
          else
            echo "OpenLane produced GDS:"
            find openlane tapeout -type f -name "*.gds" | xargs ls -lh 2>&1 | head -20
            if ! find openlane/gpu_top -name "*.gds" | grep -q .; then
              echo "gpu_top GDS missing — generating placeholder for top viewers"
              python3 tapeout/generate_placeholder_gds.py tapeout/gds/tt_um_4d_cache.placeholder.gds --die 160 --title "tt_um_4d_cache 160x100 gpu_top macro"
            fi
            # Scaling macros fallback — ensure 1mm viewers always have GDS
            for d in shader systolic sram_4k warp axi gpu_top_1mm; do
              if ! find openlane/$d -name "*.gds" 2>/dev/null | grep -q .; then
                echo "$d GDS missing — generating placeholder"
                case $d in
                  shader) python3 tapeout/generate_placeholder_gds.py tapeout/gds/simd_alu.placeholder.gds --die 200 --title "simd_alu 200x200 8-lane FP32" ;;
                  systolic) python3 tapeout/generate_placeholder_gds.py tapeout/gds/systolic_4x4.placeholder.gds --die 300 --title "systolic_4x4 300x300 4x4 GEMM" ;;
                  sram_4k) python3 tapeout/generate_placeholder_gds.py tapeout/gds/sram_4k.placeholder.gds --die 400 --title "sram_4k 400x400 4KB OpenRAM" ;;
                  warp) python3 tapeout/generate_placeholder_gds.py tapeout/gds/warp_scheduler.placeholder.gds --die 200 --title "warp_scheduler 200x200 GTO" ;;
                  axi) python3 tapeout/generate_placeholder_gds.py tapeout/gds/axi_slave.placeholder.gds --die 200 --title "axi_slave 200x200" ;;
                  gpu_top_1mm) python3 tapeout/generate_placeholder_gds.py tapeout/gds/gpu_top_1mm.placeholder.gds --die 1000 --title "gpu_top_1mm 1000x1000 4-CU" ;;
                esac
              fi
            done
          fi
          ls -lh tapeout/gds/ 2>&1 | head -20 || true
          # Verify viewable in both viewers (GDS header check)
          python3 -c "import pathlib; p=list(pathlib.Path('tapeout/gds').glob('*.gds'))+list(pathlib.Path('openlane').rglob('*.gds')); print('viewer files:', [str(x) for x in p]); assert p, 'no gds for viewers'"

      - name: Upload GDS artifacts (viewers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gds
          path: |
            openlane/cache4d/runs/**/results/final/gds/*.gds
            openlane/wdm_arbiter/runs/**/results/final/gds/*.gds
            openlane/shader/runs/**/results/final/gds/*.gds
            openlane/systolic/runs/**/results/final/gds/*.gds
            openlane/sram_4k/runs/**/results/final/gds/*.gds
            openlane/warp/runs/**/results/final/gds/*.gds
            openlane/axi/runs/**/results/final/gds/*.gds
            openlane/gpu_top_1mm/runs/**/results/final/gds/*.gds
            openlane/**/runs/**/*.gds
            tapeout/gds/*.gds
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SDF for post-layout gls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdf
          path: |
            openlane/gpu_top/runs/**/results/final/sdf/*.sdf
            openlane/gpu_top_1mm/runs/**/results/final/sdf/*.sdf
            openlane/**/runs/**/results/final/sdf/*.sdf
            openlane/**/runs/**/results/**/*.sdf
          if-no-files-found: warn
          retention-days: 30

      - name: Upload reports (DRC/LVS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            openlane/cache4d/runs/**/reports/**
            openlane/wdm_arbiter/runs/**/reports/**
            openlane/gpu_top/runs/**/reports/**
            openlane/shader/runs/**/reports/**
            openlane/systolic/runs/**/reports/**
            openlane/sram_4k/runs/**/reports/**
            openlane/warp/runs/**/reports/**
            openlane/axi/runs/**/reports/**
            openlane/gpu_top_1mm/runs/**/reports/**
            openlane/**/runs/**/reports/**
            /tmp/ol_*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Collect PNG renders
        if: always()
        run: |
          find openlane -type f -name "*.png" 2>&1 | head -20 || true
          mkdir -p /tmp/renders
          find openlane -type f -name "*.png" -exec cp {} /tmp/renders/ \; 2>&1 | head -20 || true
          ls -lh /tmp/renders 2>&1 | head -20 || true

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: /tmp/renders/*.png
          if-no-files-found: warn
          retention-days: 30
